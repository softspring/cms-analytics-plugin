services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Softspring\CmsAnalyticsPlugin\:
        resource: '../../src/*'
        exclude: '../../src/DependencyInjection/*'

    Softspring\CmsAnalyticsPlugin\Analytics\StatisticsProviderChain:
        public: true
        arguments:
            $providers: !tagged_iterator sfs_cms_analytics.statistics_provider

    Softspring\CmsAnalyticsPlugin\Analytics\PlausibleStatisticsProvider:
        tags:
            - { name: 'sfs_cms_analytics.statistics_provider' }

    Softspring\CmsAnalyticsPlugin\Analytics\GoogleAnalyticsStatisticsProvider:
        tags:
            - { name: 'sfs_cms_analytics.statistics_provider', priority: 20 }

    Softspring\CmsAnalyticsPlugin\Analytics\GoogleAnalyticsAccessTokenProviderInterface:
        alias: Softspring\CmsAnalyticsPlugin\Analytics\GoogleAnalyticsAccessTokenProvider

    Softspring\CmsAnalyticsPlugin\Admin\Menu\ContentMenuProvider:
        tags: [ 'sfs_cms.admin_menu.menu_provider' ]

    Softspring\CmsAnalyticsPlugin\Admin\Routing\ContentTypeRoutingProvider:
        tags: [ 'sfs_cms.routing_provider' ]

    sfs_cms.analytics_plugin.admin.content_statistics.controller:
        class: Softspring\CmsAnalyticsPlugin\Controller\Admin\ContentStatisticsController
        public: true
